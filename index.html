<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071018">
<title>ETHERIA — 回声大陆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}body{font-family:"Plus Jakarta Sans",sans-serif}</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="load-logo">ETHERIA</div><div class="load-sub">回声大陆</div><div class="load-track"><i id="loadBar"></i></div><span id="loadText">正在唤醒世界…</span></div>
<div id="hud" class="hidden">
<header><div class="brand"><b>ETHERIA</b><span>回声大陆</span></div><div class="region"><span id="weatherDot"></span><span id="regionName">晨雾谷</span><small id="clock">06:42</small></div><button id="menuBtn">☰</button></header>
<div id="quest"><small>当前任务</small><b id="questTitle">初见晨雾谷</b><span id="questHint">跟随金色光标前往村庄</span></div>
<div class="player-card"><div class="avatar">E</div><div><b>旅者</b><span>Lv. 7</span></div><div class="hp"><i id="hpFill"></i></div><small id="hpText">820 / 820</small></div>
<div id="interact" class="hidden"><b id="interactName">旧灯塔</b><span>靠近探索</span></div>
<div id="combat" class="hidden"><div><b id="enemyName">荒原狼</b><span id="enemyLevel">Lv. 5</span></div><div class="enemy-hp"><i id="enemyHp"></i></div></div>
<div id="crosshair" class="hidden">+</div>
<div id="hint">WASD 移动 · 鼠标拖拽镜头 · Shift 冲刺 · E 互动</div>
<div id="mobileControls" class="hidden"><div id="joy"><i></i></div><div class="mobile-actions"><button id="attackBtn">攻击</button><button id="dashBtn">冲刺</button><button id="skillBtn">元素技</button></div></div>
</div>
<div id="start" class="screen"><div class="title"><small>A NEW WORLD AWAITS</small><h1>ETHERIA</h1><h2>回声大陆</h2><p>一片可以真正走进去的幻想大陆</p></div><button id="startBtn">进入世界 <span>→</span></button><div class="start-tip">开放世界 · 探索 · 战斗 · 任务 · 收集</div></div>
<div id="menu" class="overlay hidden"><div class="panel"><button class="close" id="closeMenu">×</button><small>SYSTEM</small><h2>旅行手册</h2><div class="tabs"><button class="active" data-tab="map">地图</button><button data-tab="bag">背包</button><button data-tab="quests">任务</button><button data-tab="settings">设置</button></div><div id="tabContent"></div></div></div>
<div id="dialogue" class="dialogue hidden"><div class="dialogue-box"><small id="dialogueRole">村民</small><h2 id="dialogueName">艾琳</h2><p id="dialogueText"></p><button id="dialogueNext">继续</button></div></div>
<div id="toast"></div>
<script type="module" src="js/main.js?v=world-01"></script>
</body></html>
