<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050711"><title>VOID//RUN — 虚空回响</title><link rel="stylesheet" href="css/game.css"></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="topbar"><div><b>VOID//RUN</b><span id="region">断层边缘</span></div><div class="stats"><span id="wave">WAVE 1</span><span id="hp">HP 100</span><span id="core">CORE 0</span></div></div><div id="objective"></div></div><div id="touch"><div id="moveStick" class="stick"><i></i></div><div id="aimStick" class="stick"><i></i></div><button id="dash" class="action">DASH</button></div><section id="menu" class="screen"><div class="logo"><small>RECOVERED PROTOCOL</small><h1>VOID//RUN</h1><p>虚空回响</p></div><div class="menuButtons"><button id="newGame">开始运行</button><button id="continueGame">继续记录</button><button id="loreBtn">世界档案</button><button id="settingsBtn">系统设置</button></div><div class="version">BUILD 02 · ECHO PROTOCOL</div></section><section id="dialogue" class="panel hidden"><div class="panelHead"><span id="speaker">ASTER</span><span id="commId">COMM</span></div><div id="dialogueText"></div><div id="choices"></div><button id="closeDialogue" class="minor">结束通讯</button></section><section id="upgrade" class="panel hidden"><div class="panelHead"><span>RECOVERY MODULE</span><span id="upgradeWave"></span></div><p>从本轮回收的数据中选择一项强化。</p><div id="upgradeChoices" class="cards"></div></section><section id="secret" class="panel hidden"><div class="panelHead"><span>UNKNOWN ROOM</span><span>NULL</span></div><h2>断层深处</h2><p id="secretText"></p><button id="takeSecret">接入 CORE</button><button id="leaveSecret" class="minor">离开</button></section><section id="lore" class="panel hidden"><div class="panelHead"><span>WORLD ARCHIVE</span><span>ARCHIVE</span></div><div id="loreList" class="scroll"></div><button id="closeLore" class="minor">返回</button></section><section id="settings" class="panel hidden"><div class="panelHead"><span>SYSTEM</span><span>SETTINGS</span></div><label>震动反馈 <input id="vibrate" type="checkbox"></label><label>自动瞄准 <input id="autoAim" type="checkbox"></label><label>自动射击 <input id="autoFire" type="checkbox"></label><label>左手模式 <input id="leftHand" type="checkbox"></label><label>灵敏度 <input id="sensitivity" type="range" min="50" max="150" value="100"><output id="sensValue">100%</output></label><button id="closeSettings" class="minor">返回</button></section><section id="death" class="screen hidden"><div class="logo"><small>SIGNAL LOST</small><h2>运行终止</h2><p id="deathReason"></p></div><button id="retry">重新进入</button><button id="deathMenu" class="minor">返回主菜单</button></section><section id="ending" class="screen hidden"><div class="logo"><small>RUN COMPLETE</small><h2 id="endingTitle"></h2><p id="endingText"></p></div><button id="endingMenu" class="minor">返回主菜单</button></section><script type="module" src="js/main.js"></script></div></body></html>
